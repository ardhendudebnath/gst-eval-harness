name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip pytest

      # Guards the stdlib-only promise: labelling, validation and self-agreement
      # must work on a fresh clone before anyone runs pip install. If someone
      # adds a third-party import to one of these, this step fails.
      - name: Core imports need no dependencies
        run: |
          python -c "
          import harness.schema, harness.validate, harness.label.cli
          import harness.calibration.kappa, harness.calibration.self_agreement
          import harness.collect.normalise, harness.collect.openfoodfacts
          print('core is dependency-free')
          "

      # Runs with pypdf absent, so the pypdf-dependent test skips.
      - name: Unit tests (no extras)
        run: python -m pytest tests -q

      - name: Unit tests (with collect extra)
        run: |
          python -m pip install pypdf
          python -m pytest tests -q

      # The archived notifications are the ground truth for every rate claim in
      # the repository. This checks their hashes and re-reads the entries that
      # must be present, so a corrupted or swapped file fails the build rather
      # than silently changing what the dataset means.
      - name: Verify archived primary sources
        run: python -m harness.verify_primary

      # Schema + composition checks on the golden set. Not --strict yet: the
      # dataset is still being built and will be off-target until it is frozen.
      - name: Validate dataset
        run: python -m harness.validate

  # Model runs and the nightly leaderboard refresh arrive in week 6, once there
  # is a suite to run. Adding an empty scheduled job before then would only
  # produce a green badge that means nothing.
