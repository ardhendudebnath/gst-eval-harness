[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gst-eval-harness"
version = "0.1.0"
description = "An open benchmark for Indian GST rate-slab classification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# The dataset tooling (collect, label, validate, self-agreement) is stdlib-only
# on purpose: `make validate` has to work on a fresh clone before anyone runs
# pip install. Model runners in week 4 add the optional extras below.
dependencies = []

[project.optional-dependencies]
models = [
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=0.3",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
