[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gst-eval-harness"
version = "0.1.0"
description = "An open benchmark for Indian GST rate-slab classification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Labelling, validation and self-agreement are stdlib-only on purpose:
# `make validate` has to work on a fresh clone before anyone runs pip install.
# Only the AAR collector needs anything, and only because advance rulings are
# published as PDFs.
dependencies = []

[project.optional-dependencies]
collect = [
    "pypdf>=5.0",
]
models = [
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=0.3",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
