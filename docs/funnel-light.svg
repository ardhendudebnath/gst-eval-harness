<text x="647.7" y="194.3" text-anchor="end" font-size="18" font-weight="700" fill="#2a78d6">605</text>
<text x="659.7" y="189.3" text-anchor="start" font-size="13" font-weight="400" fill="#0b0b0b">ruling PDFs fetched and cached</text>
<text x="659.7" y="206.3" text-anchor="start" font-size="11" font-weight="400" fill="#898781">roughly half are scans with no text layer</text>
<text x="647.7" y="256.3" text-anchor="end" font-size="18" font-weight="700" fill="#2a78d6">126</text>
<text x="659.7" y="251.3" text-anchor="start" font-size="13" font-weight="400" fill="#0b0b0b">rulings kept as goods classification</text>
<text x="659.7" y="268.3" text-anchor="start" font-size="11" font-weight="400" fill="#898781">services, immovable property, withdrawals and duplicates screened out</text>
<text x="647.7" y="318.3" text-anchor="end" font-size="18" font-weight="700" fill="#2a78d6">70</text>
<text x="659.7" y="313.3" text-anchor="start" font-size="13" font-weight="400" fill="#0b0b0b">carry a heading from the authority's own holding</text>
<text x="659.7" y="330.3" text-anchor="start" font-size="11" font-weight="400" fill="#898781">the rest state no tariff heading in the operative ruling</text>
<text x="647.7" y="380.3" text-anchor="end" font-size="18" font-weight="700" fill="#0ca30c">28</text>
<text x="659.7" y="375.3" text-anchor="start" font-size="13" font-weight="400" fill="#0b0b0b">resolve to exactly one entry in the Gazette</text>
<text x="659.7" y="392.3" text-anchor="start" font-size="11" font-weight="400" fill="#898781">41 span several schedules — a judgement, not a lookup</text>
<text x="647.7" y="442.3" text-anchor="end" font-size="18" font-weight="700" fill="#d03b3b">0</text>
<text x="659.7" y="437.3" text-anchor="start" font-size="13" font-weight="400" fill="#0b0b0b">confirmed by a human</text>
<text x="659.7" y="454.3" text-anchor="start" font-size="11" font-weight="400" fill="#898781">the dataset's central claim, and it is still zero</text>
